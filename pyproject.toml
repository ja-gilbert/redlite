[project]
name = "redlite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gevent>=26.8.0",
]

[project.scripts]
redlite = "redlite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "ruff>=0.16.7",
]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
